# CI baseline for dsh-thinking-levels.
# Generated 2026-11-05. Chain: install -> typecheck -> lint -> test -> build.
# Rationale: this repo is an owned DSH plugin and previously had no workflow;
# publish.yml is intentionally NOT included (npm secret is not uploaded to
# GitHub Actions; releases stay manual until Trusted Publishing is configured).

name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
